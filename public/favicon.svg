<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Compliance Sphere</title>
  <style>
    .cs-ring { fill: none; stroke: #1a1a1a; stroke-width: 1.7; }
    .cs-core { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .cs-ring { stroke: #ffffff; }
      .cs-core { fill: #ffffff; }
    }
  </style>
  <circle class="cs-ring" cx="16" cy="16" r="10.5"/>
  <circle class="cs-ring" cx="16" cy="16" r="6"/>
  <circle class="cs-core" cx="16" cy="16" r="2.2"/>
</svg>
